<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Lanz Pascual" />
    <meta name="description" content="Little AI Software Engineers" />
    <meta
      name="keywords"
      content="study aids, flashcards, learning materials"
    />
    <title>Flashcards for Little AI Software Engineer</title>
    <link href="favicon.ico" rel="icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900"
      rel="stylesheet"
    />
    <link href="assets/css/index.css" rel="stylesheet" />
    <script type="module" src="./assets/js/index.js"></script>
  </head>
  <body class="page">
    <header class="header">
      <h1 class="header__title">
        <a class="header__link" href="#home">Flash Cards</a>
      </h1>
      <nav class="nav">
        <ul class="nav__links">
          <li class="nav__item">
            <a class="nav__link" href="#home">My Decks</a>
          </li>
          <li class="nav__item">
            <a class="nav__link" href="#about">About</a>
          </li>
        </ul>
      </nav>
    </header>
    <main class="page__main-content">
      <section class="gallery" id="home">
        <h2 class="gallery__title">My Decks</h2>
        <div class="gallery__wrapper">
          <ul class="gallery__list">
            <template id="deck-template">
              <li class="gallery__item card card_color_green">
                <a class="card__link" href="#"></a>
                <h3 class="card__title"></h3>
                <div class="card__row">
                  <span class="card__count"></span>
                  <button
                    class="card__delete-btn"
                    type="button"
                    aria-label="Delete this deck."
                  >
                    <img src="assets/images/delete.svg" alt="Delete deck" />
                  </button>
                </div>
              </li>
            </template>
            <template id="card-template">
              <li class="gallery__item card card_color_green">
                <h3 class="card__title"></h3>

                <div class="card__row">
                  <button
                    class="card__btn card__btn_type_flip"
                    type="button"
                    aria-label="Flip card"
                  ></button>
                  <button
                    class="card__btn card__btn_type_delete"
                    type="button"
                    aria-label="Delete card"
                  ></button>
                </div>
              </li>
            </template>
            <li class="gallery__item gallery__new">
              <button class="gallery__new-card-btn" type="button">
                + New Deck
              </button>
            </li>
          </ul>
        </div>
      </section>
      <section class="gallery" id="deck-view">
        <div class="gallery__header">
          <h2 class="gallery__title"></h2>
          <button class="gallery__practice-btn" type="button">Practice</button>
        </div>
        <div class="gallery__wrapper">
          <ul class="gallery__list">
            <li class="gallery__item gallery__new">
              <button
                class="gallery__new-card-btn gallery__new-card-btn_location_deck-view"
                type="button"
              >
                + New Card
              </button>
            </li>
          </ul>
        </div>
      </section>
      <section class="carousel" id="carousel" hidden>
        <h2 class="carousel__title">HTML Tags Deck &middot; 1/10</h2>
        <div class="carousel__grid">
          <button
            class="carousel__btn carousel__btn_type_left carousel__btn_disabled"
            type="button"
            aria-label="Previous card"
          ></button>
          <button
            class="carousel__btn carousel__btn_type_flip"
            type="button"
            aria-label="Flip card"
          ></button>
          <div class="carousel__card">
            <p class="carousel__card-text">&lt;body&gt;&lt;/body&gt;</p>
          </div>
          <button
            class="carousel__btn carousel__btn_type_right"
            type="button"
            aria-label="Next card"
          ></button>
        </div>
      </section>
      <section class="not-found" id="not-found">
        <h2 class="not-found__title">404</h2>
        <p class="not-found__text">Page Not Found</p>
      </section>
    </main>
    <footer class="footer">
      <p class="footer__text">&copy;2026 Lanz Pascual</p>
    </footer>
  </body>
</html>
